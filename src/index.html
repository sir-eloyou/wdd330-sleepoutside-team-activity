<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="category">
        <div class="box">
       
          <a href="/product_listing/?category=tents">
            <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-tents.svg" alt="tent-icon">
          </a>
          <p>Tents</p>
        </div>
        <div class="box">
          
          <a href="/product_listing/?category=backpacks">
            <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-backpacks.svg" alt="backpack-icon">
          </a>
          <p>Backpacks</p>
        </div>
        <div class="box">
           <a href="/product_listing/?category=sleeping-bags">
            <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-sleepingbags.svg" alt="sleepingbags-icon">
          </a>
          <p>Sleeping Bags</p>
        </div>
        <div class="box">
           <a href="/product_listing/?category=hammocks">
            <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-hammocks.svg" alt="hammocks-icon">
          </a>
          <p>Hammocks</p>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
